# =============================================================================
# X-Frame Docker Compose - Infra only (PostgreSQL + Redis)
# =============================================================================
# For local development / intranet prep: run dependencies only.
# App runs on host: go run ./cmd/server + pnpm dev
#
# Usage:
#   cd deploy
#   copy .env.infra.example .env.infra   # first time
#   docker compose -f docker-compose.infra.yml --env-file .env.infra up -d
#
# Offline (intranet): load images from _internal first, see _internal/README.md
# =============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: x-frame-postgres
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DATABASE_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      # postgres:18-alpine 默认 PGDATA 在镜像匿名卷内；显式设置才能落盘到挂载目录
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-x-frame}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-x-frame}
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-x-frame} -d ${POSTGRES_DB:-x-frame}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: x-frame-redis
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis_data:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
